name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gold-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  gold-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  stocks-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q --ignore=tests/test_breadth_math.py
