services:
  - type: web
    name: phan-tich-co-phieu
    runtime: python
    plan: free
    buildCommand: pip install -r stocks/requirements.txt
    startCommand: cd stocks && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --log-level warning
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: VNSTOCK_DISABLE_AGENT_SETUP
        value: "1"
      - key: ADMIN_TOKEN
        sync: false   # dat trong Render Dashboard (Settings > Environment); de trong = mo
      - key: DATABASE_URL
        sync: false   # Neon pooler URL — da set tu truoc trong Render Dashboard

  # App gia vang Aurum Terminal (Node/TypeScript: server.ts + frontend Vite o repo root)
  - type: web
    name: aurum-gold
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: GOLD_API_TOKEN
        sync: false   # dat trong Render Dashboard; de trong = API ghi mo (khong nen)
