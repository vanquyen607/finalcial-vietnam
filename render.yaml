services:
  - type: web
    name: phan-tich-co-phieu
    runtime: python
    plan: free
    buildCommand: pip install -r stocks/requirements.txt
    startCommand: cd stocks && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --log-level warning
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
