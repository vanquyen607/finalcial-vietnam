services:
  aurum:
    build: .
    image: aurum-terminal:1.0
    container_name: aurum
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOLD_HOST: 0.0.0.0
      GOLD_DB_PATH: /app/data/gold.db
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: always
